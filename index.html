<script>
/* Only surfaces an error if the app genuinely never started.
   Ignores opaque cross-origin "Script error." noise and anything after first render. */
window.__mlRendered = false;
function __mlShow(msg){ var el=document.getElementById('app');
  if(el) el.innerHTML='<div style="padding:28px 22px;font:15px/1.5 -apple-system,system-ui,sans-serif;color:var(--text)">'
   +'<b>Still loading…</b><br><br>If this keeps happening, re-check your Firebase setup: make sure <b>only the config values</b> were pasted '
   +'(no line with <code>getAnalytics</code>, <code>firebase/analytics</code>, or a second <code>const app</code>), '
   +'and that the <b>Firestore database rules were published</b>.<br><br>'
   +'<span style="color:#C24A33;word-break:break-word">'+msg+'</span></div>'; }
window.addEventListener('error', function(e){
  if(window.__mlRendered) return;                       // app already up — ignore stray errors
  var msg=(e&&e.message)||'';
  if(msg.indexOf('Script error')===0) return;           // opaque cross-origin event, not actionable
  __mlShow(msg||'Unknown error');
});
window.addEventListener('unhandledrejection', function(e){
  if(window.__mlRendered) return;
  var r=e&&e.reason; __mlShow((r&&r.message)?r.message:String(r));
});
setTimeout(function(){ if(!window.__mlRendered){ var el=document.getElementById('app');
  if(el && /Opening the list/.test(el.textContent||'')) __mlShow('The list did not load.'); } }, 7000);
</script>
<script>
/* v2.15: the app reports its own crashes to /api/feedback (kind "crash") so a phone that breaks is not invisible
   until someone mentions it. At most 3 a day per phone, each message once per session, and never the list:
   query strings (the list code is one) and hosts are stripped, and only the message and the first line of the
   stack are sent. Network failures, aborts, ResizeObserver noise and opaque "Script error." are not crashes. */
(function(){
  var KEY='ml_crashday', CAP=3, seen={};
  function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function count(){ try{ var v=String(localStorage.getItem(KEY)||'').split('|'); return v[0]===today() ? (+v[1]||0) : 0; }catch(e){ return CAP; } }
  function bump(){ try{ localStorage.setItem(KEY, today()+'|'+(count()+1)); }catch(e){} }
  function clean(s){ return String(s||'').replace(/\?[^\s:)'"]*/g,'').replace(/https?:\/\/[^\s/]+/g,'').slice(0,200); }
  function noise(m){ return !m || /^Script error/.test(m) || /ResizeObserver loop/.test(m)
    || /^(Failed to fetch|Load failed|NetworkError|The network connection was lost|Importing a module script failed|The user aborted|The operation was aborted|signal is aborted|Fetch is aborted)/i.test(m); }
  function report(msg, stack){
    msg=clean(msg); if(noise(msg) || seen[msg]) return; seen[msg]=1;
    if(navigator.onLine===false || count()>=CAP) return; bump();
    var bare=msg.replace(/^Uncaught (\w*Error: )?/,'');   // the stack's own first line repeats the message as "Error: …"
    var first=String(stack||'').split('\n').map(function(l){ return clean(l.trim()); }).filter(function(l){ return l && l.indexOf(bare)<0; })[0]||'';
    var page=''; try{ page=typeof window.__mlPageName==='function' ? window.__mlPageName() : ''; }catch(e){}
    var body={ kind:'crash', text:(msg+(first?'\n'+first:'')).slice(0,2000),
      diag:{ version:String(window.__mlVersion||'unknown'), page:String(page||''), screen:innerWidth+'x'+innerHeight, ua:String(navigator.userAgent||'').slice(0,120) } };
    try{ fetch('/api/feedback',{ method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body), keepalive:true }).catch(function(){}); }catch(e){}
  }
  window.__mlReport=report;
  window.addEventListener('error', function(e){ report(e && e.message, e && e.error && e.error.stack); });
  window.addEventListener('unhandledrejection', function(e){ var r=e && e.reason; if(r && r.name==='AbortError') return;   // a request we cancelled on purpose (timeouts)
    report(r && r.message ? r.message : String(r), r && r.stack); });
})();
</script>
