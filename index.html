  /* v1.54 item 1: row-gap then column-gap — the two axes are separately settable. */
  .pills { display:flex; flex-wrap:wrap; gap:max(0px, var(--tilegapy,8px)) max(0px, var(--tilegapx,8px)); margin-top:6px; }

     declarations are inert at every value >= 0 (min(0px, 8px) is 0), so the normal case is untouched. */

  /* v1.54 item 1: fill, line and roundness are all user-settable; the fallbacks are the old literals. */

     that is on the list; "unselected" is a regular that is not. Defaults reproduce exactly what the

  /* v1.63 item 2: `.plus` and `.catadd` are no longer in this list. A3 hid them because shopping mode

  /* v1.50 item 3: "Empty" means no coloured and no darkened left bar — on the shop list, on in-cart

  html[data-tilebg] .pill:not(.done):not(.reg-out) .pill-meta { color:var(--tiletext, var(--ink)) !important; }
  html[data-fill="empty"] .pill, html[data-fill="empty"] .bapill,

  .wallrow { display:flex; flex-wrap:wrap; gap:6px; width:100%; }

  }
  /* v1.12 per-item emoji icon */
  .pemoji { flex:none; font-size:15px; margin-right:1px; }
  .shop .pemoji { font-size:18px; }
  .addrow .pemoji { font-size:17px; }
  /* v1.16 display picker (2×2) */
  .dispgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .dispopt { border:1.5px solid var(--line); background:var(--card); color:var(--text); font-weight:700; font-size:12.5px; padding:10px 6px; border-radius:11px; }
  .dispopt.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  /* v1.27 Display: List / Large Tile (2–6 cols) / Small Tile, stacked */
  .displist { display:flex; flex-direction:column; gap:6px; width:100%; }
  .dispopt2 { border:1.5px solid var(--line); background:var(--card); color:var(--text); font-weight:700; font-size:13.5px; padding:11px 14px; border-radius:12px; text-align:left; }
  .dispopt2.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .dispcols { display:flex; gap:6px; margin:1px 0 3px; }
  /* v1.43 item 4: the column choices belong beside the tile they configure, not on a line below it —
     as a full-width row underneath, nothing said which tile they belonged to. 4×2 grid so all seven
     buttons fit in the height of one tdopt. */
  .tdrow { display:flex; align-items:stretch; gap:8px; }
  .tdrow > .tdopt { flex:1 1 auto; min-width:0; }
  .tdrow > .dispcols { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin:0; align-content:center; }
  .tdrow > .dispcols .colbtn { flex:none; min-width:26px; padding:5px 0; font-size:12.5px; }
  .colbtn { flex:1; border:1.5px solid var(--line); background:var(--card); color:var(--text); font-weight:800; font-size:14px; padding:9px 0; border-radius:10px; }
  .colbtn.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  /* v1.28 Tile display picker with mini layout previews */
  .tdlist { display:flex; flex-direction:column; gap:8px; width:100%; }
  /* v1.41 item 4: this never set a text colour, so the button fell back to the UA default (black).
     That is invisible on Noir's near-black card — one of the reported "white text does not display"
     rows in Settings. Bind it to the ink token like every other control. */
  .tdopt { display:flex; align-items:center; gap:12px; width:100%; border:1.5px solid var(--line); background:var(--card); color:var(--text); border-radius:12px; padding:9px 12px; text-align:left; }
  .tdopt.on { border-color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .tdlabel { font-weight:700; font-size:13.5px; color:var(--text); }
  .tdprev { flex:none; width:52px; height:40px; border-radius:7px; background:var(--chip); padding:5px; box-sizing:border-box; display:flex; overflow:hidden; }
  .tdprev-list { flex-direction:column; justify-content:center; gap:4px; }
  .tdprev-list i { display:block; height:5px; border-radius:3px; background:var(--muted2); opacity:.55; }
  .tdprev-listcat { flex-direction:column; justify-content:center; gap:3px; }
  .tdprev-listcat b { display:block; height:4px; width:55%; border-radius:2px; background:var(--accent); opacity:.85; }
  .tdprev-listcat i { display:block; height:4px; border-radius:2px; background:var(--muted2); opacity:.5; }
  .tdprev-grid, .tdprev-small { display:grid; gap:3px; align-content:center; }
  .tdprev-small { grid-template-columns:repeat(4,1fr); }
  .tdprev-grid u, .tdprev-small u { display:block; border-radius:2.5px; background:var(--muted2); opacity:.55; aspect-ratio:1; }
  /* v1.39 item 5: the variable-width preview draws tiles of DIFFERENT lengths instead of a fixed grid */
  .tdprev-var { display:flex; flex-wrap:wrap; align-content:center; gap:3px; }
  .tdprev-var u { display:block; height:8px; border-radius:2.5px; background:var(--muted2); opacity:.55; aspect-ratio:auto; }
  .tdprev-var u:nth-child(1){ width:60%; } .tdprev-var u:nth-child(2){ width:32%; }
  .tdprev-var u:nth-child(3){ width:28%; } .tdprev-var u:nth-child(4){ width:44%; }
  .tdprev-var u:nth-child(5){ width:20%; }
  .tdprev-grid b, .tdprev-small b { grid-column:1/-1; display:block; height:4px; border-radius:2px; background:var(--accent); opacity:.85; }
  .tdprev-var b { width:100%; display:block; height:4px; border-radius:2px; background:var(--accent); opacity:.85; }
  /* v1.15 combined-page planning section (regulars to re-add, below the shopping list) */
  .plansec { margin-top:22px; border-top:1.5px dashed var(--line); padding-top:12px; }
  .plansec-h { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 2px 8px; }
  .plansec-toggle { flex:none; border:none; background:var(--chip); color:var(--text); font-weight:800; font-size:11px; text-transform:none; letter-spacing:0; padding:5px 11px; border-radius:999px; }
  .regtick { font-size:19px; font-weight:900; line-height:1; margin-right:2px; }
  .reg-in .regplus, .regplus { font-weight:900; margin-right:2px; }
  /* v1.11 shop checklist rows + plan qty-banner remove + finish dialog */
  .shop .pcheck { margin-left:0; margin-right:11px; width:27px; height:27px; }
  .pill-meta { margin-left:auto; display:inline-flex; align-items:center; gap:5px; padding-left:10px; }
  .qbanner-rm { border:1.5px solid #C24A33; color:#C24A33; background:transparent; font-weight:800; font-size:13px; padding:6px 14px; border-radius:999px; }
  /* v1.10 bottom-first add — floating pill + full-screen add sheet */
  .addpill-wrap { position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:480px; z-index:41; padding:0 14px; display:flex; }
  .addpill { flex:1; display:flex; align-items:center; gap:9px; border:1.5px solid var(--line); border-radius:999px; padding:13px 18px;
    background:var(--card); color:var(--muted); font-weight:700; font-size:14.5px; text-align:left;
    box-shadow:0 10px 26px rgba(20,30,22,.22); }
  .addpill svg { flex:none; }
  /* v1.38 item 3 — the sheet is PINNED to the visual viewport by JS (pinAddSheet), not by CSS units.
     v1.36 sized it with dvh math, which is correct until iOS scrolls the *visual* viewport to reveal
     the focused input: position:fixed tracks the LAYOUT viewport, so the whole sheet slid up and only
     its foot stayed on screen. pinAddSheet writes explicit top/height that include
     visualViewport.offsetTop, which cancels that scroll exactly. These are fallbacks for the
     no-visualViewport case only. */
  /* v1.46: no fixed height — the sheet HUGS its content and only caps out at 92dvh. The fixed height
     is what produced the big empty grey slab above the search bar whenever the keyboard was down or
     the content was short. The scrim `.sheet-bg` is display:flex/align-items:flex-end, so with
     height:auto the un-pinned fallback still sits on the bottom edge. */
  .addsheet { max-height:92dvh;
    display:flex; flex-direction:column; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  .addsheet.kbup { padding-bottom:0; }   /* v1.31 with the keyboard up, the search bar sits flush on it (no dark gap) */
  /* when JS pins it, the sheet positions itself rather than being laid out by the flex scrim */
  .addsheet.vvpin { position:fixed; left:0; right:0; margin:0 auto; }
  /* v1.40 item 1: the add sheet now deploys slowly and smoothly (0.8s) instead of snapping up in
     0.24s. pinAddSheet() re-writes top/height several times across the keyboard's animation window,
     so those are transitioned too — otherwise each re-pin lands as a visible jump. */
  /* `.sheet` sets `animation:sheetup .24s` further down the stylesheet at equal specificity, so it
     would win on source order — hence `.sheet.addsheet` here. Its own keyframe travels the full sheet
     height (the shared `sheetup` only nudges 28px, which reads as sluggish stretched over 0.8s). */
  @keyframes addsheetup { from{ opacity:.4; transform:translateY(100%) } to{ opacity:1; transform:translateY(0) } }
  /* v1.49: 1.5s is the chosen deploy speed — the sheet is meant to glide up. This is a product
     decision, not a debugging aid; do not "optimise" it back down. */
  /* v1.50: the deploy is no longer a keyframe that fires the instant the node is inserted. The open is
     staged — the page dims first, and only then does the sheet travel — so the motion is driven by two
     classes the JS toggles (`.parked` → `.deploy`) instead. `addsheetup` is kept for the reduced-motion
     path and as the no-JS fallback. */
  .sheet.addsheet { animation:none; }
  /* v1.52: parked means "entirely off the bottom of the SCREEN", which is not the same as translating
     by its own height. The sheet is now pinned to its final geometry before the stage begins (that is
     what stops iOS scrolling the viewport at focus), so its box already sits `bot` px up from the
     bottom edge — translateY(100%) alone left that strip of paper showing while the page was meant to
     be quietly dimming. --parkoff is the reserved keyboard strip, written by pinAddSheet. */
  .addsheet.parked { transform:translateY(calc(100% + var(--parkoff, 0px))); opacity:.35; transition:none; }
  /* 1.1s of travel: the user asked for a slow, readable slide, deliberately. Do not "optimise" it down.
     The selector carries `.sheet` purely for specificity: `.addsheet.vvpin` below declares its own
     `transition` at the same weight and later in the sheet, so it silently won and the slide snapped. */
  .sheet.addsheet.deploy { transform:translateY(0); opacity:1;
    transition:transform 1.1s cubic-bezier(.22,.61,.36,1), opacity .45s ease, bottom .34s cubic-bezier(.22,.61,.36,1); }
  /* v1.54 item 3: the close is the open played backwards, so the sheet has to travel on its own
     first — before the keyboard goes and before the scrim lifts. Three classes deliberately: .deploy
     is still on the node at this point and carries the same weight, so only source order separates
     them. Keep this rule below it. .7s rather than the open's 1.1s — a dismissal that takes as long
     as the entrance reads as the app hanging. */
  .sheet.addsheet.retract { transform:translateY(calc(100% + var(--parkoff,0px))); opacity:.35;
    transition:transform .7s cubic-bezier(.4,0,.6,1), opacity .45s ease .18s; }
  /* v1.46: pinAddSheet now writes bottom/max-height (bottom-anchored, content-sized), so those are
     the properties that need easing — transitioning top/height no longer matches what JS writes. */
  /* v1.49: .34s (was .28s) so keyboard-driven re-pins glide rather than snap. */
  /* v1.49: only `bottom` is eased. Transitioning the heights meant the box ANIMATED its growth,
     which is half of what made the deploy read as a moving slab; the size should just be right. */
  /* v1.50: `.deploy` carries the bottom transition too (a later, more specific rule would otherwise
     drop it mid-slide). This one covers the settled state, once .deploy has done its travel. */
  .addsheet.vvpin { transition:bottom .34s cubic-bezier(.22,.61,.36,1); }
  /* v1.50: the scrim fades in on its own, BEFORE anything moves — this is the "stay on the shop page
     and just change the background" half of the sequence. */
  /* v1.50: the overdraw is painted with a 600px box-shadow spread rather than by moving the element's
     own edges. Stretching `top`/`bottom` past the viewport would also drag the flex fallback layout
     (`.sheet-bg` is align-items:flex-end) 500px off the bottom of the screen on any browser without
     visualViewport, where the sheet is NOT position-pinned. The shadow covers the same ground and
     changes no geometry at all. */
  .sheet-bg#addBg { transition:opacity .4s ease; box-shadow:0 0 0 600px rgba(33,53,31,.45); }
  /* v1.49: the strip the keyboard and its accessory bar occupy gets its own fixed filler. v1.47
     covered it by inflating the SHEET instead — which made the sheet ~820px of paper on an 844px
     screen, and the deploy then swept that near-full-screen slab up the display. White on Ink,
     black on Dark: that was the reported flash. This filler never moves, never slides, and is only
     ever as tall as the keyboard strip it hides behind. */
  .addsheet-under { position:fixed; left:0; right:0; bottom:0; height:0; display:none;
    background:var(--paper); z-index:1; pointer-events:none; }
  @media (prefers-reduced-motion: reduce){ .sheet.addsheet { animation-duration:.01ms; }
    .addsheet.vvpin, .sheet.addsheet.deploy, .sheet.addsheet.retract, .sheet-bg#addBg { transition:none; } }
  .addsheet-head { display:flex; gap:8px; align-items:flex-start; }
  .addsheet-done { flex:none; border:none; background:var(--btn); color:var(--btn-text); font-weight:800; font-size:14px; padding:11px 16px; border-radius:14px; }
  .addsheet-tabs { margin:10px 0; }
  /* v1.35 grab handle — drag down to dismiss the add sheet */
  .addsheet-grab { flex:none; display:flex; justify-content:center; padding:9px 0 6px; touch-action:none; cursor:grab; }
  .addsheet-grab .grabbar { width:36px; height:5px; border-radius:3px; background:var(--line); }
  /* v1.30 results scroll above; the search bar (foot) pins at the bottom and rises with the keyboard (--kb).
     v1.35 item 3: justify-content:flex-end docks short content (search strip / edit panel) flush above the bar. */
  /* v1.36: the sheet itself is now sized/lifted for the keyboard (above), so the body no longer pads
     by --kb and the foot no longer translates — it just sits at the bottom of the shrunken sheet. */
  /* v1.38 item 3: results hug the search bar. `justify-content:flex-end` only bottom-aligns when the
     content is SHORTER than the box; the box is flex:1 so a tall empty area still pushed the strip up.
     Sizing to content (flex:0 1 auto + margin-top:auto) parks it directly on top of the bar. */
  /* v1.40 item 1: overscroll-behavior:contain stops the sheet's scroll chaining out to the page,
     which is what made the sheet itself move; the tighter gap/padding pulls results closer to the bar. */
  /* v1.46: with the sheet capped by max-height (not fixed height), this box scrolls on its own as
     soon as the edit panel outgrows the sheet. scrollbar-width:thin makes that visible where
     scrollbars render; `> * { flex:none }` stops flex from shrinking children, which combined with
     justify-content:flex-end is what can make the TOP of overflowing content unreachable. */
  /* v1.46: justify-content is flex-START, not flex-end. In a SCROLLING flex container, content that
     overflows past flex-end spills off the TOP where it is unreachable and does not even extend
     scrollHeight — measured 308px of box against a 322px panel, 14px silently clipped, which is the
     reported "Save row hidden behind the search bar with no way to scroll to it". Bottom-docking is
     already handled by this box's own margin-top:auto, which sizes it to content and parks it on the
     bar, so flex-end was doing nothing except breaking overflow. */
  .addsheet-body { flex:0 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; display:flex; flex-direction:column; justify-content:flex-start; gap:4px; padding-bottom:4px; margin-top:auto; scrollbar-width:thin; }
  .addsheet-body > * { flex:none; }
  /* …and the panel is itself a flex column, so its ROWS shrink too unless told not to. That is what
     squashed the weight/flag rows and pushed the Save row under the search bar instead of letting the
     panel overflow and scroll — the reported "cut off with no way to reach it". */
  .addedit > * { flex:none; }
  .addsheet-foot { flex:none; display:flex; flex-direction:column; gap:8px; }
  .addsheet-barrow { display:flex; gap:8px; align-items:center; }
  .addcatlbl { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 2px 2px; }
  /* v1.31 clean solid search pill (matches the reference) — sits flush above the keyboard */
  /* v1.40 item 1: sized to match the shop page's floating .addpill (47px) so tapping the bar doesn't
     change its height. box-sizing keeps the border inside that 47px. */
  .searchbar { flex:1; min-width:0; display:flex; align-items:center; gap:9px; background:var(--card);
    border:1px solid var(--line); border-radius:999px; padding:0 8px 0 15px; min-height:47px; box-sizing:border-box;
    box-shadow:0 6px 18px rgba(20,30,22,.14); }
  .searchbar-ic { flex:none; display:flex; align-items:center; color:var(--muted); }
  .searchbar-ic svg { display:block; }
  .addsheet-donebtn { flex:none; border:none; background:transparent; color:var(--text); font-weight:700; font-size:15px; padding:8px 6px; }   /* v1.34 plain Done (closes the sheet) */
  /* v1.34 item 4: search matches rendered as the app's own shop pills.
     v1.66 item 1: they WRAP now instead of living in a horizontally scrolling row. The row could not
     be panned on iOS across three attempts — it was a horizontal scroller nested inside the panel's
     vertical scroller, inside a keyboard-pinned fixed sheet, with a transform:scale() element in
     between, which is the same shape the weight popover had to abandon in v1.64. Wrapping puts the
     results on the one scroll that demonstrably works: the panel's. */
  .addwrap { width:100%; }
  .addgrid { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:2px; }
  .addgrid .pill { flex:none; white-space:nowrap; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  .addresults { width:100%; }   /* v1.31 typed matches rendered as literal shop pills */
  .addresults .pills { margin-top:2px; }

     tightened under a `.addedit` scope instead of at the base, so the other screens are unchanged. */

  .addedit-flags { display:flex; gap:6px; }
  /* v1.62 item 5: a weight control that is part of the sheet instead of a system overlay. The native
     <select> opens the iOS picker, which takes the keyboard away and covers half the screen — it
     cannot be made smaller, so it is replaced. Every control in it cancels pointerdown so focus
     (and the keyboard) never leave the search field. */
  .wbtn { flex:none; height:40px; min-width:74px; padding:0 10px; border-radius:14px; border:none;
    background:var(--chip); color:var(--text); font-size:14px; font-weight:600; display:inline-flex;
    align-items:center; justify-content:center; gap:5px; }
  .wbtn .wcar { font-size:11px; color:var(--muted); }
  /* v1.64 item 1: the choices as a wrapping chip grid in the panel's own flow — same shape and same
     `.catchip` as the Category and Subcategory chips two rows below, so the panel has one way of
     offering a list of options rather than two. */
  .wgrid { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .wgrid .catchip.on { background:var(--btn); border-color:var(--btn); color:var(--btn-text); }
  .addedit-actions { display:flex; gap:8px; margin-top:2px; }
  .addedit-more { flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--text); font-weight:700; font-size:14px; padding:8px 12px; border-radius:12px; }
  .addedit-remove { flex:none; border:1.5px solid #C24A33; background:transparent; color:#C24A33; font-weight:700; font-size:14px; padding:8px 12px; border-radius:12px; }
  .addedit-done { flex:1; border:none; background:var(--btn); color:var(--btn-text); font-weight:800; font-size:15px; border-radius:12px; padding:9px; }
  /* v1.46: .flagchip and .editsec are shared with the full-screen edit sheet — tighten them only
     inside the inline panel. Two classes beat the single-class base rules on specificity. */
  .addedit .flagchip { padding:6px 5px; font-size:12px; }
  .addedit .editsec { padding:7px 0 3px; margin-top:4px; }
  .searchbar .inwrap { flex:1; min-width:0; }
  /* display:block matters — a textarea is inline-level by default, so its .inwrap parent reserved a
     line box with descender space under it and the bar measured 51px instead of the shop pill's 47px. */
  .searchbar textarea { display:block; width:100%; height:45px; min-height:45px; max-height:110px; padding:12px 34px 12px 2px; border:none; background:transparent; color:var(--text); font-size:15px; font-family:inherit; line-height:21px; resize:none; outline:none; }
  .addcatlbl-sep { margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
  .addrow { display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); background:var(--card); color:var(--text);
    border-radius:14px; padding:11px 13px; font-weight:700; font-size:14.5px; text-align:left; }
  .addrow:active { transform:scale(.98); }
  .addrow.on { border-color:var(--accent); }
  .addrow.on .addrow-plus { background:var(--accent); color:var(--on-accent); }
  .addrow-plus { flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--chip); color:var(--text); font-weight:900; font-size:15px; }
  .addrow-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .addrow-meta { flex:none; font-size:12.5px; font-weight:800; color:var(--muted2); }
  .addrow-cad { flex:none; font-size:11px; font-weight:800; color:var(--accent); border:1.5px solid var(--accent); border-radius:999px; padding:2px 8px; }
  .addrow.addtyped { border-style:dashed; border-color:var(--accent); color:var(--accent); }
  .addrow.addtyped .addrow-plus { background:var(--accent); color:var(--on-accent); }
  /* v1.09/1.14 page-slide transitions (Lists ▸ Plan ▸ Shop) — single-layer slide of the incoming .wrap */
  @keyframes tickpop { 0%{transform:scale(.5)} 55%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .pill.picking .pcheck { animation:tickpop .3s cubic-bezier(.32,.72,.3,1); }
  @keyframes sheetup { 0%{opacity:0;transform:translateY(28px)} 70%{opacity:1;transform:translateY(-4px)} 100%{opacity:1;transform:translateY(0)} }
  .sheet { animation:sheetup .24s cubic-bezier(.32,.72,.3,1); }
  @keyframes toastup { 0%{opacity:0;transform:translate(-50%,10px)} 70%{opacity:1;transform:translate(-50%,-3px)} 100%{opacity:1;transform:translate(-50%,0)} }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    .pill:active { transform:none; }
    .justpop { animation:none !important; }
  }

<script type="module">

const APP_BUILD_DATE = (()=>{ try{ const d=new Date(document.lastModified); if(isNaN(d.getTime())) return "";
  const p=n=>String(n).padStart(2,"0");

const MARKET_CATS = ["meat","vegetable","fruit","fresh"];   // Dandenong market only stocks these

function byAisle(a,b){ const ra=aisleRank(a),rb=aisleRank(b); if(ra!==rb) return ra-rb; return bySortKey(a,b); }

let aiOrder = loadLearn("ml_aiorder");
let _aiTripCats = [];   // distinct categories checked so far this shopping trip, in order

let _aiTripItems = [];

}

    const im = aiItems[key] || (aiItems[key] = {});

// B7: display ranks against the ACCEPTED order (aiApplied), never the live EMA —
// so the list can't silently reshuffle mid-shop while learning keeps updating aiOrder.
let aiApplied = loadLearn("ml_aiapplied");
let aiDismiss = loadLearn("ml_aidismiss");

  if(catPos.length) return catPos.reduce((a,b)=>a+b,0)/catPos.length + 0.5;   // unseen item → near its learned category-mates

}
function byAI(a,b){ const ra=aiRank(a),rb=aiRank(b); if(ra!==rb) return ra-rb; return bySortKey(a,b); }

function aiProposal(){

  const onList=[...new Set(state.items.filter(i=>!i.checked).map(i=>i.cat))];
  const prop=aiSeq(aiOrder,key).filter(c=>onList.includes(c));
  if(prop.length < 2) return null;                                                  // fewer than 2 learned cats on the list
  const curL=onList.slice().sort((a,b)=>aiRank({cat:a,name:""})-aiRank({cat:b,name:""})).filter(c=>prop.includes(c));
  const propKey=prop.join(">");
  if(propKey===curL.join(">")) return null;                                         // already in the learned order → nothing to propose

}
function aiResetStore(){ const key=aiStoreKey();
  delete aiOrder[key]; delete aiApplied[key]; delete aiDismiss[key]; delete aiItems[key]; delete aiItemsApplied[key]; _aiTripCats=[]; _aiTripItems=[];
  try{ localStorage.setItem(lkey("ml_aiorder"),JSON.stringify(aiOrder)); localStorage.setItem(lkey("ml_aiapplied"),JSON.stringify(aiApplied)); localStorage.setItem(lkey("ml_aidismiss"),JSON.stringify(aiDismiss)); localStorage.setItem(lkey("ml_aiitems"),JSON.stringify(aiItems)); localStorage.setItem(lkey("ml_aiitemsapplied"),JSON.stringify(aiItemsApplied)); }catch(e){}

function aiApplyProposal(){
  const key=aiStoreKey();

  delete aiDismiss[key];
  try{ localStorage.setItem(lkey("ml_aiapplied"), JSON.stringify(aiApplied)); localStorage.setItem(lkey("ml_aidismiss"), JSON.stringify(aiDismiss)); }catch(e){}
  render();
}
function aiDismissProposal(){
  const p=aiProposal(); if(p){ aiDismiss[p.key]=p.propKey; try{ localStorage.setItem(lkey("ml_aidismiss"), JSON.stringify(aiDismiss)); }catch(e){} }

/* B4 predictive replenishment — on-device. Logs a purchase whenever items are

}
function recordPurchase(items){
  const now=Date.now();

  purch = state.purch;                                               // record into the shared history (sweep()'s save() syncs it)
  for(const it of items){ const nm=(it.name||"").trim(); if(!nm) continue; const key=nm.toLowerCase()+"|"+it.cat;
    const rec = purch[key] || (purch[key]={name:nm,cat:it.cat,qty:it.qty||1,weight:it.weight||"",sub:it.sub||"",ts:[]});
    rec.name=nm; rec.cat=it.cat; if(it.qty) rec.qty=it.qty; if(it.weight!=null) rec.weight=it.weight; if(it.sub!=null) rec.sub=it.sub;

function _median(a){ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }

}
function predictStarted(d){ d=d||new Date();

function predictDue(){

/* B5 de-duplication & merge — on-device (no AI). Clusters look-alike items by a
   token-subset rule (one name refines another, e.g. "milk" ⊆ "whole milk"), so

   don't. Proposes only; the merge is reversible via the standard Undo. */
let mergeX = {}; try{ mergeX = JSON.parse(localStorage.getItem("ml_merge_x")||"null") || {}; }catch(e){ mergeX={}; }
function singular(w){ if(w.length<=3) return w;
  if(w.endsWith("ss")||w.endsWith("us")) return w;                       // glass, hummus — not plurals
  if(w.endsWith("ies")&&w.length>4) return w.slice(0,-3)+"y";            // berries→berry
  if(w.endsWith("es")&&/(ch|sh|s|x|z)es$/.test(w)) return w.slice(0,-2); // boxes→box, dishes→dish
  if(w.endsWith("s")) return w.slice(0,-1);                              // chips→chip
  return w; }

  return [...sa].every(t=>sb.has(t)) || [...sb].every(t=>sa.has(t)); }   // one token set ⊆ the other
function mergeClusters(){
  const byCat={};

    (byCat[it.cat]||(byCat[it.cat]=[])).push({it, tok}); }
  const out=[];

    const parent=arr.map((_,i)=>i);

    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ if(_subsetMerge(arr[i].tok,arr[j].tok)) parent[find(i)]=find(j); }
    const cl={};
    for(let i=0;i<n;i++){ const r=find(i); (cl[r]||(cl[r]=[])).push(arr[i]); }
    for(const r in cl){ const members=cl[r]; if(members.length<2) continue;
      const its=members.map(m=>m.it);
      const sig=its.map(i=>i.name.toLowerCase()).sort().join("|");
      if(mergeX[sig]) continue;
      const canon=members.slice().sort((a,b)=> a.tok.length-b.tok.length || a.it.name.length-b.it.name.length)[0].it;

  const keepId=cl.items[0].id, ids=new Set(cl.items.map(i=>i.id));
  state.items = state.items.filter(i=>!ids.has(i.id));

function mergeCardHTML(){

/* v1.15 combined page — the "planning" section, shown below the shopping list. Your regulars
   (previously-bought items not currently on the list) as dotted pills, grouped by category and

/* v1.17 one row per regular — selected (on the list) shows a solid pill; not-selected shows a
   dotted pill. Tap toggles; long-press edits. Sorted A-Z. */
function regPill(entry, cat, it){
  // v1.20 regulars look identical to shopping-list rows: emoji · name, qty/weight on the right.
  // Selected (already on the list) uses the Full/Empty tile look; not-selected keeps the dotted
  // outline (no "+"). No tick on selected — the solid/filled look already reads as "on the list".
  const selected = !!it;
  const q = selected ? (it.qty||1) : (entry.qty||1);
  const w = selected ? (it.weight||"") : (entry.weight||"");
  const full = selected && fillMode()==="full";
  const qcol = metaCol(cat.color, selected, full);
  const em = itemEmoji(entry.name, cat.id);
  const emS = em?`<span class="pemoji" aria-hidden="true">${em}</span>`:"";
  const meta = `${q>1?`<span class="qty" style="color:${qcol}">${q}×</span>`:""}${w?`<span class="qty" style="color:${qcol}">${esc(w)}</span>`:""}`;
  const metaS = meta?`<span class="pill-meta">${meta}</span>`:"";
  const name = esc(cap(entry.name));
  if(selected){
    /* v1.57 item 1: only the category-driven parts stay inline. Fill, line and text now come from
       CSS so that one rule owns all four sides of the border — see .pill.reg-in / .pill.reg-out. */
    const style = full ? fullStyle(cat.color, true)
      : (fillMode()==="empty" ? "" : `border-left:4px solid ${catEdge(cat.color, true)}`);
    return `<button class="pill reg-in" data-reg-rm="${it.id}" style="${style}">${emS}${name}${metaS}</button>`;
  }
  /* v1.57 item 1: the unselected regular used to hard-code its own border, background and text
     inline. The Empty-mode rule repaints border-left-color with !important, which beat the inline
     declaration for that ONE side and left the other three grey — a coloured bar down the left of a
     tile that is not on the list at all. All four sides come from the same token now. */
  const outStyle = fillMode()==="full" ? fullStyle(cat.color, false)
    : fillMode()==="empty" ? ""
    : `border-left:4px solid ${catEdge(cat.color, false)}`;
  return `<button class="pill reg-out" data-reg-add="${esc(entry.name)}|${cat.id}" style="${outStyle}">${emS}${name}${metaS}</button>`;
}

// B3 recipe-shaped input (steps / servings / cooking verbs) routes to /api/recipe so servings scale
function looksLikeRecipe(t){
  const s=(t||"").toLowerCase();
  if(/\bserves?\s+\d/.test(s)) return true;
  const steps=/(preheat|bake|roast|simmer|whisk|knead|combine|saut|\bfry\b|\bboil\b|marinat|garnish|drain|dough|batter|\boven\b|\bmin(ute)?s?\b|°|degrees|tbsp|tsp|tablespoon|teaspoon)/;
  const lines=(t||"").split(/\n/).filter(l=>l.trim()).length;
  return steps.test(s) && lines>=3;
}
async function smartAdd(){
  const mi=document.getElementById("mainInput");
  const text=(mi?mi.value:"").trim();
  if(!text) return;
  const recipe=looksLikeRecipe(text);
  smartOpen=true; smartLoading=true; smartError=""; smartItems=[]; smartEdit=null; smartServings=null; render();
  let res, data;
  try{
    res=await fetch(recipe?"/api/recipe":"/api/parse",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text})});
  }catch(e){ res=null; }
  if(!res){
    smartLoading=false; smartError="Couldn't reach Smart add. Check your connection — you can still type items normally."; render(); return;
  }
  if(res.status===500){
    smartLoading=false; smartError="Smart add isn't set up yet. Add a GROQ_API_KEY in Vercel (see docs/ai-setup.md). You can still type items normally."; render(); return;
  }
  if(!res.ok){
    smartLoading=false; smartError="Couldn't read that — try rephrasing, or just type your items."; render(); return;
  }
  try{ data=await res.json(); }catch(e){ data=null; }
  const raw=(data&&Array.isArray(data.items))?data.items:null;
  if(!raw){ smartLoading=false; smartError="Couldn't read that — try rephrasing, or just type your items."; render(); return; }
  const allowed=catList().map(c=>c.id);
  smartItems=raw.map(it=>{ const q=(Number.isFinite(+(it&&it.qty))&&+it.qty>=1)?Math.min(999,Math.round(+it.qty)):1;
    return {
      name:String(it&&it.name||"").trim(),
      qty:q, baseQty:q, sub:"",
      category:(it&&allowed.includes(String(it.category)))?String(it.category):"others",
      weight:(it&&typeof it.weight==="string")?it.weight.trim().slice(0,16):"",
    }; }).filter(it=>it.name);
  if(recipe){ const src=(data&&+data.servings>=1)?Math.round(+data.servings):4;
    smartServings={ src, target:src, title:(data&&data.title)?String(data.title).slice(0,80):"" }; }
  smartLoading=false;
  if(!smartItems.length){ smartError=recipe?"No ingredients found — try pasting the full recipe.":"Nothing to add from that — try adding more detail, or type your items."; }
  render();
}
function recipeScale(delta){
  if(!smartServings) return;
  const t=Math.max(1,Math.min(99,(smartServings.target||smartServings.src)+delta));

}

            return chip(lo,"Darker") + chip(hi,"Lighter"); })()}`
      + `${Object.keys(pal).map(sw).join("")}</div></div>`;

        }).join("");
        return head + `<div class="histrows">${rows}</div>`;
      }).join("");
      return pick + grp + `<div class="histlist">${body}</div>`

function wireAddBar(){
  const mi=document.querySelector("#mainInput");   // v1.49: the sheet lives in <body>, not under #app
  const mc=document.querySelector("#mainClear");
  const toggleClear=(el,btn)=>{ if(btn) btn.classList.toggle("show", !!(el&&el.value.trim())); };
  const commit=(text)=>{ const t=(text||"").trim(); if(!t) return; draftMain=""; playPlan(true);
    addKeepScroll(()=>stageAdds(()=>addEntries(t,null)));
    const m2=document.getElementById("mainInput"); if(m2){ m2.value=""; m2.focus(); } };
  if(mi){ mi.value=draftMain; grow(mi); toggleClear(mi,mc);
    mi.oninput=()=>{ draftMain=mi.value; grow(mi); toggleClear(mi,mc); if(addEditId) addEditId=null; if(addOpen) refreshAddBody(); };   // v1.32 typing returns from the details panel to search
    mi.onkeydown=e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault();
      /* v1.40 item 1: the keyboard's blue tick now finishes the whole add flow — commit whatever is
         typed, then land back on the shop page. It used to only commit and leave the sheet open. */
      if(addOpen){
        /* v1.44 item 5: the return key is the "I'm done" gesture — commit what's typed and land back on
           the shop page. With the edit panel open the bar only MIRRORS the item that is already on the
           list, so committing its text would add a duplicate; only the prefix typed before it is real. */
        const raw = addEditId ? (addEditPrefix||"") : (mi.value||"");
        const t = raw.trim().replace(/,\s*$/,"");
        if(t){ draftMain=""; playPlan(true); stageAdds(()=>addEntries(t,null)); }
        commitAddSheet(); return; }
      commit(mi.value); } };
    mi.onpaste=e=>{ const t=(e.clipboardData||window.clipboardData).getData("text");
      const looksLikeBlock = t && (t.indexOf("\n")>=0 || /\b(meat|fruit|vegetable|veg|fresh|bulk|asian|alcohol|health|others)\s*:/i.test(t) || t.split(",").length>2);
      if(looksLikeBlock){ e.preventDefault(); commit(t); } }; }
  if(mc){ mc.onpointerdown=e=>e.preventDefault(); mc.onclick=()=>{ if(mi){ mi.value=""; draftMain=""; grow(mi); toggleClear(mi,mc); if(addOpen) refreshAddBody(); mi.focus(); } }; }
  const sb=document.querySelector("#smartBtn"); if(sb){ sb.onpointerdown=e=>e.preventDefault(); sb.onclick=smartAdd; }
}

  const regPress=(b,shortFn,longIdFn)=>{ b.oncontextmenu=e=>e.preventDefault();   // v1.17 tap toggles, long-press edits
    b.onpointerdown=e=>{ e.preventDefault(); pressStart(); }; b.onpointerleave=pressCancel; b.onpointercancel=pressCancel;
    b.onpointerup=()=>{ pressCancel(); if(longFired){ const id=longIdFn&&longIdFn(); if(id) editItemById(id); return; } shortFn(); }; };
  app.querySelectorAll("[data-reg-add]").forEach(b=>{ const p=b.dataset.regAdd.split("|"), cat=p.pop(), name=p.join("|");
    regPress(b, ()=>addFromRegular(name,cat), ()=>{ addFromRegular(name,cat); const it=findItem(name,cat); return it&&it.id; }); });
  app.querySelectorAll("[data-reg-rm]").forEach(b=>{ const id=b.dataset.regRm;
    regPress(b, ()=>removeFromList(id), ()=>id); });
  const ot=app.querySelector("#optBtnTop"); if(ot) ot.onclick=()=>{ optOpen=true; listsOpen=false; render(); };
  app.querySelectorAll("[data-example]").forEach(b=>b.onclick=()=>{ addEntries(b.dataset.example, null); });
  wireQuickPanel();
  const ac=app.querySelector("#addCat"); if(ac) ac.onclick=addCategory;

  /* options sheet */
  wireOptions();

  /* lists sheet */
  const lsBg=app.querySelector("#listsBg"); if(lsBg) lsBg.onclick=()=>{ listsOpen=false; render(); };
  const lsS=app.querySelector("#listsSheetEl"); if(lsS) lsS.onclick=e=>e.stopPropagation();
  app.querySelectorAll("[data-list]").forEach(b=>b.onclick=()=>switchList(b.dataset.list));
  app.querySelectorAll("[data-list-up]").forEach(b=>b.onclick=()=>moveList(b.dataset.listUp,-1));
  app.querySelectorAll("[data-list-down]").forEach(b=>b.onclick=()=>moveList(b.dataset.listDown,1));
  app.querySelectorAll("[data-list-del]").forEach(b=>b.onclick=()=>delList(b.dataset.listDel));
  const nl=app.querySelector("#newList"); if(nl) nl.onclick=newListPrompt;
  const rl=app.querySelector("#renameList"); if(rl) rl.onclick=renameList;


  wireEditSheet();
}
function wireEditSheet(){
  if(editing){
    const bg=app.querySelector("#sheetBg"); if(bg) bg.onclick=()=>{ editing=null; render(); };
    const sh=app.querySelector("#sheet"); if(sh) sh.onclick=e=>e.stopPropagation();
    if(editing.kind==="newcat"){
      const cn=app.querySelector("#catName"); if(cn) cn.oninput=e=>{ editing.label=e.target.value; autoIcon(); refreshStrip(); };
      wireIconEditor();
      const cc=app.querySelector("#newCreate"); if(cc) cc.onclick=createCategoryFromSheet;
      const cx=app.querySelector("#newCancel"); if(cx) cx.onclick=()=>{ editing=null; render(); };
    } else if(editing.kind==="cat"){
      const cn=app.querySelector("#catName"); if(cn) cn.oninput=e=>{ editing.label=e.target.value; autoIcon(); refreshStrip(); };
      wireIconEditor();
      const mu=app.querySelector("#moveUp"); if(mu) mu.onclick=()=>{ saveCatEditQuiet(); const cs=catList(); const i=cs.findIndex(c=>c.id===editing.id); moveCat(editing.id,i-1); };
      const md=app.querySelector("#moveDown"); if(md) md.onclick=()=>{ saveCatEditQuiet(); const cs=catList(); const i=cs.findIndex(c=>c.id===editing.id); moveCat(editing.id,i+1); };
      const asb=app.querySelector("#addSubBtn"); if(asb) asb.onclick=()=>{ saveCatEditQuiet(); addSub(editing.id); };
      app.querySelectorAll("[data-sublabel]").forEach(inp=>{ inp.onchange=()=>{ const c=catList().find(x=>x.id===editing.id); const s=c&&c.subs.find(z=>z.id===inp.dataset.sublabel); if(s){ s.label=(inp.value||"").trim()||s.label; save(); } }; });
      if(pendingSubFocus){ const ni=app.querySelector(`[data-sublabel="${pendingSubFocus}"]`); pendingSubFocus=null; if(ni){ ni.focus(); } }
      app.querySelectorAll("[data-subup]").forEach(b=>b.onclick=()=>{ saveCatEditQuiet(); moveSub(editing.id,b.dataset.subup,-1); });
      app.querySelectorAll("[data-subdown]").forEach(b=>b.onclick=()=>{ saveCatEditQuiet(); moveSub(editing.id,b.dataset.subdown,1); });
      app.querySelectorAll(".subdel").forEach(b=>b.onclick=()=>{ saveCatEditQuiet(); removeSub(editing.id, b.dataset.sub); });
      const cr=app.querySelector("#catRemove"); if(cr) cr.onclick=()=>removeCat(editing.id);
      const csv=app.querySelector("#catSave"); if(csv) csv.onclick=saveCatEdit;
    } else if(editing.kind==="bacat"){
      const cn=app.querySelector("#catName"); if(cn) cn.oninput=e=>{ editing.label=e.target.value; };
      wireIconEditor();
      const shown = catList().filter(c=> state.items.some(i=>i.cat===c.id) || c.custom).length;
      const persistPos=()=>{ state.baMeta={label:editing.label||"Buy again", emoji:editing.img?"":(editing.emoji||"↩"), img:editing.img||"", pos:editing.pos}; save(); };
      const bu=app.querySelector("#baUp"); if(bu) bu.onclick=()=>{ editing.pos=Math.max(0,(Math.min(editing.pos|0,shown))-1); persistPos(); render(); };
      const bd=app.querySelector("#baDown"); if(bd) bd.onclick=()=>{ editing.pos=Math.min(shown,(Math.min(editing.pos|0,shown))+1); persistPos(); render(); };
      const bdel=app.querySelector("#baDeleteHist"); if(bdel) bdel.onclick=()=>{ const prev=snapState(); const now=Date.now(); state.baTomb=state.baTomb||{}; state.buyAgain.forEach(e=>{ state.baTomb[baKey(e)]=now; }); state.buyAgain=[]; editing=null; save(); render(); showUndo(prev,"Buy-again history cleared"); };
      const bsv=app.querySelector("#baCatSave"); if(bsv) bsv.onclick=()=>{ state.baMeta={label:(editing.label||"").trim()||"Buy again", emoji:editing.img?"":(editing.emoji||"↩"), img:editing.img||"", pos:editing.pos|0}; rememberList(listCode, state.name); editing=null; save(); render(); };
    } else {
      const en=app.querySelector("#editName"); if(en) en.oninput=e=>editing.name=e.target.value;
      /* v1.62 item 5: the same in-sheet weight control the add panel uses. Scoped to #sheet rather
         than the document: the add sheet is mounted outside `app` and uses the same attribute names,
         so an unscoped query here could rebind its buttons to `editing`. */
      document.querySelectorAll("#sheet [data-w-open]").forEach(b=>{ b.onpointerdown=e=>e.preventDefault();
        b.onclick=()=>{ wOpen = (wOpen==="edit") ? null : "edit"; render();
          /* v1.64 item 1: bring the newly-opened grid into view — same reason as the add panel. */
          const g=document.querySelector("#sheet .wgrid"); if(g) g.scrollIntoView({block:"nearest"}); }; });
      document.querySelectorAll("#sheet [data-w-set]").forEach(b=>tapNoScroll(b, ()=>{
        const w=b.dataset.wSet.split("|")[1]||""; editing.weight=w; wOpen=null; render(); }));
      const qm=app.querySelector("#qMinus"); if(qm) qm.onclick=()=>{ editing.qty=Math.max(1,(editing.qty||1)-1); render(); };
      const qp=app.querySelector("#qPlus"); if(qp) qp.onclick=()=>{ editing.qty=(editing.qty||1)+1; render(); };
      app.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>{ editing.cat=b.dataset.ec; editing.sub=null; render(); });
      app.querySelectorAll("[data-es]").forEach(b=>b.onclick=()=>{ editing.sub=b.dataset.es||null; render(); });
      app.querySelectorAll("[data-flag]").forEach(b=>b.onclick=()=>{ const k=b.dataset.flag; const t=Array.isArray(editing.tags)?editing.tags.slice():[]; const i=t.indexOf(k); if(i<0)t.push(k); else t.splice(i,1); editing.tags=t;
      /* v1.62 item 2: "get this now" and "only if you happen to pass it" are opposite instructions —
         an item cannot be both. Selecting one clears the other rather than refusing the tap, so the
         control never feels stuck. */
      if(k==="urgent") editing.tags = editing.tags.filter(t=>t!=="convenient");
      else if(k==="convenient") editing.tags = editing.tags.filter(t=>t!=="urgent");
      /* v1.58 item 1: Urgent and the old ★ were two controls for one idea. The chip is now the only
         one, and it keeps `starred` in step so the existing "urgent floats to the top" sort and any
         item saved by an older build both keep working. */
      editing.starred = (editing.tags||[]).includes("urgent");
      render(); });
      const ech=app.querySelector("#ecHead"); if(ech) ech.onclick=()=>{ editCatOpen=!editCatOpen; render(); };
      const esh=app.querySelector("#esHead"); if(esh) esh.onclick=()=>{ editSubOpen=!editSubOpen; render(); };
      const eac=app.querySelector("#ecAddCat"); if(eac) eac.onclick=()=>{ const nm=prompt("New category name:",""); if(nm&&nm.trim()){ const id=makeCategory(nm); if(id){ editing.cat=id; editing.sub=null; render(); } } };
      const eas=app.querySelector("#esAddSub"); if(eas) eas.onclick=()=>{ if(!editing.cat){ showToast("Pick a category first"); return; } const nm=prompt("New subcategory name:",""); if(nm&&nm.trim()){ const id=makeSub(editing.cat,nm); if(id){ editing.sub=id; render(); } } };
      const sec=app.querySelector("#secBtn"); if(sec) sec.onclick=()=> editing.kind==="item" ? removeEditing() : restoreEditingToList();
      const del=app.querySelector("#delBtn"); if(del) del.onclick=()=> editing.kind==="item" ? deleteItemEditing() : removeBAfromSheet();
      const sv=app.querySelector("#saveBtn"); if(sv) sv.onclick=()=> editing.kind==="item" ? saveEdit() : saveBA();
    }
  }
}

/* Three linear pages: Lists (0) ▸ Plan (1) ▸ Shop (2). Plan and Shop share view="detail",
   distinguished by shopMode. A horizontal swipe drags the live page with the finger before
   committing (see transitionTo for the animation). */
function curPageIdx(){ return optOpen ? 2 : (view==="lists" ? 0 : 1); }   // v1.20 linear pages: Lists(0) · Shop(1) · Settings(2)
function applyPage(idx){
  catEntry=null; quickEdit=null;
  if(idx===2){ optOpen=true; return; }   // Settings sits to the right of Shop
  optOpen=false;
  if(idx===0){ view="lists"; } else { view="detail"; shopMode=true; }
}
let _pageAnim=false;
/* v1.14/1.18 single-layer transition: render the new page, then slide/fade the incoming .wrap in
   from the correct side. No cloned "ghost" layer, so the old and new screens can never be on
   screen at the same time. As of v1.18 the fixed header (.topfix) lives OUTSIDE .wrap (so an
   ancestor transform can never unpin it on iOS Safari); only the scrolling content (.wrap) slides,
   the header and bottom nav stay put — native-tab style. */
function transitionTo(idx){
  if(idx<0 || idx>2 || _pageAnim) return;
  const from=curPageIdx();
  if(idx===from){ render(); return; }
  const dir = idx>from ? 1 : -1;                                  // 1 → new page enters from the right (it lies to the right)
  applyPage(idx);
  window.scrollTo(0,0);
  render();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const nw=app.querySelector(".wrap"); if(!nw) return;
  _pageAnim=true;
  nw.style.willChange="transform";
  const a=nw.animate(
    [{transform:"translateX("+(dir>0?100:-100)+"%)",opacity:.35},{transform:"translateX(0)",opacity:1}],
    {duration:378,easing:"cubic-bezier(.32,.72,.30,1)"});   // v1.20 slowed 40% (270→378)
  const fin=()=>{ _pageAnim=false; if(nw.isConnected) nw.style.willChange=""; };
  a.onfinish=fin; a.oncancel=fin; setTimeout(fin, 500);           // safety net if WAAPI events don't fire
}
function gotoPage(idx){ transitionTo(idx); }
// v1.20 swipe-between-pages is disabled — navigation is via the bottom nav only (the transition
// still animates, sliding in the logical direction based on the pages' relative positions).
let _swipe=null, _drag=null;
function _swipeBlocked(){ return true; }

window.addEventListener("resize", syncZoomHeight);
/* v1.63 item 3: the swap has to be in place before the first paint of THIS launch, and the appearance
   globals were read on the way down — so the one launch it runs on applies the new slot 1 and reloads
   into it. Every launch after that picks the start slot up at the top of the module, no reload. */
if(migrateAppSlots163()){ applyStoredAppearance(appSlots()[0]); }
render();
</script>
